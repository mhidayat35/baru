<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data CSV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header-refresh {
            margin-top: 15px;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .search-container {
            padding: 40px;
            text-align: center;
        }

        .search-box {
            max-width: 600px;
            margin: 0 auto 20px;
        }

        .search-input {
            width: 100%;
            padding: 18px 25px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .search-input:focus {
            border-color: #4facfe;
            box-shadow: 0 4px 20px rgba(79, 172, 254, 0.3);
        }

        .search-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 16px;
            min-width: 120px;
        }

        .search-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .floating-data {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            font-size: 24px;
        }

        .floating-data:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
        }

        .results-table {
            margin: 20px;
            overflow-x: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            word-wrap: break-word;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: #f8f9ff;
            cursor: pointer;
            transform: scale(1.01);
            transition: all 0.2s ease;
        }

        .edit-form {
            padding: 40px;
            background: #f8f9ff;
            display: none;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pagination {
            text-align: center;
            padding: 20px;
        }

        .pagination button {
            margin: 0 5px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: #4facfe;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .popup-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: scale(0);
            transition: transform 0.3s ease;
        }

        .popup.show .popup-content {
            transform: scale(1);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .search-container {
                padding: 20px;
            }

            .results-table {
                margin: 10px;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 10px 8px;
                display: block;
                border: none;
                border-bottom: 1px solid #e0e0e0;
            }

            thead {
                display: none;
            }

            tbody tr {
                display: block;
                margin-bottom: 15px;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                padding: 15px;
                background: white;
            }

            tbody td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 0;
            }

            tbody td:before {
                content: attr(data-label);
                font-weight: bold;
                color: #333;
                flex: 0 0 40%;
            }

            .edit-form {
                padding: 20px;
            }

            .floating-data {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Pencarian Data CSV</h1>
            <p>Sistem pencarian dan editing data yang cepat dan mudah</p>
            <div class="header-refresh">
                <button id="refreshBtn" class="refresh-btn">🔄 Refresh Data</button>
            </div>
        </div>

        <div id="search-section" class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Masukkan kata kunci pencarian...">
                <button id="searchBtn" class="search-btn">🔍 Cari</button>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            Sedang memproses data...
        </div>

        <div id="results-section" class="hidden">
            <div class="results-table">
                <table id="resultsTable">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="edit-section" class="edit-form">
            <h2>Edit Data</h2>
            <div id="editFields"></div>
            <button id="saveBtn" class="btn">💾 Simpan Perubahan</button>
            <button id="cancelEditBtn" class="btn btn-secondary">❌ Batal</button>
        </div>

        <div id="view-data-section" class="hidden">
            <div class="results-table">
                <table id="allDataTable">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="pagination">
                <button id="prevBtn">⬅️ Sebelumnya</button>
                <span id="pageInfo">Halaman 1</span>
                <button id="nextBtn">Selanjutnya ➡️</button>
            </div>
        </div>
    </div>

    <button id="floatingDataBtn" class="floating-data" title="Tampilkan Data">📊</button>

    <div id="popup" class="popup">
        <div class="popup-content">
            <h3>✅ Berhasil!</h3>
            <p>Data telah tersimpan dengan sukses</p>
            <button onclick="closePopup()" class="btn">OK</button>
        </div>
    </div>

    <script>
        let csvData = [];
        let indexedData = {};
        let currentEditIndex = -1;
        let currentPage = 1;
        let itemsPerPage = 10;
        let backCount = 0;
        let currentView = 'search'; // search, results, edit, viewData

        // Navigation history
        const viewHistory = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            initializeData();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('searchBtn').addEventListener('click', performSearch);
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') performSearch();
            });
            document.getElementById('refreshBtn').addEventListener('click', refreshData);
            document.getElementById('floatingDataBtn').addEventListener('click', toggleDataView);
            document.getElementById('saveBtn').addEventListener('click', saveData);
            document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);
            document.getElementById('prevBtn').addEventListener('click', () => changePage(-1));
            document.getElementById('nextBtn').addEventListener('click', () => changePage(1));

            // Handle browser back button
            window.addEventListener('popstate', function(e) {
                backCount++;
                if (backCount >= 2) {
                    if (confirm('Keluar dari aplikasi?')) {
                        window.close();
                    } else {
                        backCount = 0;
                    }
                } else {
                    goToPreviousView();
                    setTimeout(() => { backCount = 0; }, 2000);
                }
            });
        }

        async function initializeData() {
            const indexExists = sessionStorage.getItem('csvIndexed');
            
            if (!indexExists) {
                await loadAndIndexData();
            } else {
                const storedData = sessionStorage.getItem('csvData');
                const storedIndex = sessionStorage.getItem('csvIndex');
                
                if (storedData && storedIndex) {
                    csvData = JSON.parse(storedData);
                    indexedData = JSON.parse(storedIndex);
                } else {
                    await loadAndIndexData();
                }
            }
        }

        async function loadAndIndexData() {
            showLoading(true);
            
            try {
                const response = await fetch('vkrn.csv');
                if (!response.ok) {
                    throw new Error('File CSV tidak ditemukan');
                }
                
                const csvText = await response.text();
                csvData = parseCSV(csvText);
                
                // Create search index
                indexedData = createSearchIndex(csvData);
                
                // Store in session storage
                sessionStorage.setItem('csvData', JSON.stringify(csvData));
                sessionStorage.setItem('csvIndex', JSON.stringify(indexedData));
                sessionStorage.setItem('csvIndexed', 'true');
                
            } catch (error) {
                console.error('Error loading CSV:', error);
                alert('Gagal memuat file CSV. Pastikan file vkrn.csv ada di folder yang sama.');
            }
            
            showLoading(false);
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim().replace(/"/g, ''));
                const row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index] || '';
                });
                data.push(row);
            }
            
            return { headers, data };
        }

        function createSearchIndex(csvData) {
            const index = {};
            
            csvData.data.forEach((row, rowIndex) => {
                Object.values(row).forEach(value => {
                    if (value) {
                        const words = value.toLowerCase().split(/\s+/);
                        words.forEach(word => {
                            if (!index[word]) {
                                index[word] = [];
                            }
                            if (!index[word].includes(rowIndex)) {
                                index[word].push(rowIndex);
                            }
                        });
                    }
                });
            });
            
            return index;
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                alert('Masukkan kata kunci pencarian');
                return;
            }
            
            const matchedIndices = new Set();
            const words = query.split(/\s+/);
            
            words.forEach(word => {
                if (indexedData[word]) {
                    indexedData[word].forEach(index => matchedIndices.add(index));
                }
            });
            
            const results = Array.from(matchedIndices).map(index => csvData.data[index]);
            
            if (results.length > 0) {
                displayResults(results);
                switchView('results');
            } else {
                alert('Data tidak ditemukan');
            }
        }

        function displayResults(results) {
            const table = document.getElementById('resultsTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            
            // Clear existing content
            thead.innerHTML = '';
            tbody.innerHTML = '';
            
            if (results.length === 0) return;
            
            // Create header
            const headerRow = document.createElement('tr');
            csvData.headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            
            // Create rows
            results.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.addEventListener('click', () => editData(row, results.indexOf(row)));
                
                csvData.headers.forEach(header => {
                    const td = document.createElement('td');
                    td.textContent = row[header] || '';
                    td.setAttribute('data-label', header);
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
        }

        function editData(rowData, index) {
            currentEditIndex = index;
            const editFields = document.getElementById('editFields');
            editFields.innerHTML = '';
            
            csvData.headers.forEach(header => {
                const formGroup = document.createElement('div');
                formGroup.className = 'form-group';
                
                const label = document.createElement('label');
                label.textContent = header;
                
                if (header.toLowerCase() === 'keterangan') {
                    const textarea = document.createElement('textarea');
                    textarea.id = `edit_${header}`;
                    textarea.value = rowData[header] || '';
                    textarea.rows = 3;
                    formGroup.appendChild(label);
                    formGroup.appendChild(textarea);
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = `edit_${header}`;
                    input.value = rowData[header] || '';
                    
                    if (header.toLowerCase() === 'lokasi') {
                        input.placeholder = 'Mendapatkan lokasi...';
                        getCurrentLocation(input);
                    }
                    
                    // Only keterangan field is editable
                    if (header.toLowerCase() !== 'keterangan' && header.toLowerCase() !== 'lokasi') {
                        input.readOnly = true;
                        input.style.backgroundColor = '#f5f5f5';
                    }
                    
                    formGroup.appendChild(label);
                    formGroup.appendChild(input);
                }
                
                editFields.appendChild(formGroup);
            });
            
            switchView('edit');
        }

        function getCurrentLocation(input) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        input.value = `${lat}, ${lng}`;
                    },
                    function(error) {
                        input.value = 'Lokasi tidak tersedia';
                        input.placeholder = 'Masukkan lokasi manual';
                    }
                );
            } else {
                input.value = 'Geolocation tidak didukung';
                input.placeholder = 'Masukkan lokasi manual';
            }
        }

        function saveData() {
            const updatedRow = {};
            
            csvData.headers.forEach(header => {
                const input = document.getElementById(`edit_${header}`);
                updatedRow[header] = input.value;
            });
            
            // Add keterangan and lokasi columns if they don't exist
            if (!csvData.headers.includes('keterangan')) {
                csvData.headers.push('keterangan');
            }
            if (!csvData.headers.includes('lokasi')) {
                csvData.headers.push('lokasi');
            }
            
            // Update the data
            const originalData = csvData.data;
            const searchResults = Array.from(document.querySelectorAll('#resultsTable tbody tr'));
            
            // Find and update the corresponding row in original data
            for (let i = 0; i < originalData.length; i++) {
                let isMatch = true;
                for (let j = 0; j < csvData.headers.length - 2; j++) { // -2 for keterangan and lokasi
                    const header = csvData.headers[j];
                    if (originalData[i][header] !== updatedRow[header]) {
                        isMatch = false;
                        break;
                    }
                }
                
                if (isMatch) {
                    originalData[i] = { ...originalData[i], ...updatedRow };
                    break;
                }
            }
            
            // Update session storage
            sessionStorage.setItem('csvData', JSON.stringify(csvData));
            
            // Re-create search index
            indexedData = createSearchIndex(csvData);
            sessionStorage.setItem('csvIndex', JSON.stringify(indexedData));
            
            showPopup();
            switchView('results');
        }

        function cancelEdit() {
            switchView('results');
        }

        function toggleDataView() {
            if (currentView === 'viewData') {
                switchView(viewHistory[viewHistory.length - 2] || 'search');
            } else {
                showAllData();
            }
        }

        function showAllData() {
            currentPage = 1;
            displayAllData();
            switchView('viewData');
        }

        function displayAllData() {
            const table = document.getElementById('allDataTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            
            // Clear existing content
            thead.innerHTML = '';
            tbody.innerHTML = '';
            
            // Create header
            const headerRow = document.createElement('tr');
            csvData.headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            
            // Calculate pagination
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, csvData.data.length);
            const pageData = csvData.data.slice(startIndex, endIndex);
            
            // Create rows
            pageData.forEach(row => {
                const tr = document.createElement('tr');
                
                csvData.headers.forEach(header => {
                    const td = document.createElement('td');
                    td.textContent = row[header] || '';
                    td.setAttribute('data-label', header);
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
            
            // Update pagination info
            const totalPages = Math.ceil(csvData.data.length / itemsPerPage);
            document.getElementById('pageInfo').textContent = `Halaman ${currentPage} dari ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(csvData.data.length / itemsPerPage);
            const newPage = currentPage + direction;
            
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                displayAllData();
            }
        }

        function refreshData() {
            sessionStorage.removeItem('csvIndexed');
            sessionStorage.removeItem('csvData');
            sessionStorage.removeItem('csvIndex');
            loadAndIndexData();
        }

        function switchView(view) {
            // Hide all sections
            document.getElementById('search-section').classList.add('hidden');
            document.getElementById('results-section').classList.add('hidden');
            document.getElementById('edit-section').classList.add('hidden');
            document.getElementById('view-data-section').classList.add('hidden');
            
            // Update floating button
            const floatingBtn = document.getElementById('floatingDataBtn');
            
            // Show target section
            switch(view) {
                case 'search':
                    document.getElementById('search-section').classList.remove('hidden');
                    document.getElementById('searchBtn').textContent = '🔍 Cari';
                    floatingBtn.innerHTML = '📊';
                    floatingBtn.title = 'Tampilkan Data';
                    break;
                case 'results':
                    document.getElementById('search-section').classList.remove('hidden');
                    document.getElementById('results-section').classList.remove('hidden');
                    document.getElementById('searchBtn').textContent = '🔄 Cari Lagi';
                    floatingBtn.innerHTML = '📊';
                    floatingBtn.title = 'Tampilkan Data';
                    break;
                case 'edit':
                    document.getElementById('edit-section').classList.remove('hidden');
                    floatingBtn.innerHTML = '📊';
                    floatingBtn.title = 'Tampilkan Data';
                    break;
                case 'viewData':
                    document.getElementById('view-data-section').classList.remove('hidden');
                    floatingBtn.innerHTML = '⬅️';
                    floatingBtn.title = 'Kembali';
                    break;
            }
            
            // Update view history
            viewHistory.push(currentView);
            currentView = view;
            
            // Handle search button behavior
            if (view === 'results') {
                document.getElementById('searchBtn').onclick = function() {
                    document.getElementById('searchInput').value = '';
                    switchView('search');
                };
            } else if (view === 'search') {
                document.getElementById('searchBtn').onclick = performSearch;
            }
        }

        function goToPreviousView() {
            if (viewHistory.length > 0) {
                const previousView = viewHistory.pop();
                currentView = previousView;
                switchView(previousView);
            }
        }

        function showLoading(show) {
            if (show) {
                document.getElementById('loading').classList.remove('hidden');
            } else {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function showPopup() {
            const popup = document.getElementById('popup');
            popup.style.display = 'flex';
            setTimeout(() => {
                popup.classList.add('show');
            }, 10);
        }

        function closePopup() {
            const popup = document.getElementById('popup');
            popup.classList.remove('show');
            setTimeout(() => {
                popup.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
