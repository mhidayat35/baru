<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data CSV & PDF</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        /* [copy seluruh style dari file Anda] */
        /* ...style yang sudah Anda pakai di index.html... */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Pencarian Data CSV & PDF</h1>
            <p>Sistem pencarian data dengan fitur edit dan tampil PDF di bawah tabel</p>
        </div>

        <div class="search-section">
            <div id="searchForm">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Masukkan kata kunci pencarian...">
                    <button id="searchBtn" class="btn btn-primary">🔍 Cari Data</button>
                    <button id="refreshBtn" class="btn btn-warning">🔄 Refresh Index</button>
                </div>
            </div>

            <div id="status" class="status hidden"></div>

            <div id="resultsContainer" class="hidden">
                <div class="table-container">
                    <table id="resultsTable">
                        <thead id="tableHeader"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>

                <div class="actions">
                    <button id="searchAgainBtn" class="btn btn-primary hidden">🔍 Cari Lagi</button>
                    <button id="editBtn" class="btn btn-secondary">✏️ Edit Data</button>
                </div>

                <div id="editSection" class="edit-section">
                    <h3>✏️ Edit Data</h3>
                    <div class="form-group">
                        <label for="keteranganInput">Keterangan:</label>
                        <textarea id="keteranganInput" placeholder="Masukkan keterangan..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="lokasiInput">Lokasi Saat Ini:</label>
                        <input type="text" id="lokasiInput" placeholder="Mendapatkan lokasi..." readonly>
                    </div>
                    <div class="actions">
                        <button id="saveBtn" class="btn btn-primary">💾 Simpan Perubahan</button>
                        <button id="cancelEditBtn" class="btn btn-secondary">❌ Batal</button>
                    </div>
                </div>

                <!-- Tempat tampilkan PDF di bawah tabel -->
                <div id="pdfContainer" style="margin-top:30px;"></div>
            </div>
        </div>
    </div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="popup" id="popup">
        <h3 id="popupTitle">Berhasil!</h3>
        <p id="popupMessage">Data berhasil diperbarui.</p>
        <button class="btn btn-primary" onclick="closePopup()">OK</button>
    </div>

    <script>
        let csvData = [];
        let currentResults = [];
        let isIndexed = localStorage.getItem('csvIndexed') === 'true';
        let currentLocation = '';

        document.addEventListener('DOMContentLoaded', function() {
            if (!isIndexed) {
                indexData();
            } else {
                loadIndexedData();
            }
            getCurrentLocation();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('searchBtn').addEventListener('click', searchData);
            document.getElementById('searchAgainBtn').addEventListener('click', searchAgain);
            document.getElementById('refreshBtn').addEventListener('click', refreshIndex);
            document.getElementById('editBtn').addEventListener('click', showEditSection);
            document.getElementById('cancelEditBtn').addEventListener('click', hideEditSection);
            document.getElementById('saveBtn').addEventListener('click', saveChanges);

            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchData();
                }
            });
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.innerHTML = message;
            status.classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('status').classList.add('hidden');
        }

        async function indexData() {
            showStatus('<div class="spinner"></div>Sedang mengindeks data...', 'loading');
            try {
                // Mengambil file CSV sungguhan
                const response = await fetch('data_csv/data.csv');
                if (!response.ok) throw new Error('File CSV tidak ditemukan!');
                const csvText = await response.text();
                const parsed = Papa.parse(csvText, { header: true });
                csvData = parsed.data.filter(row => Object.values(row).some(v => v !== "")); // filter row kosong
                localStorage.setItem('csvIndexed', 'true');
                localStorage.setItem('csvData', JSON.stringify(csvData));
                isIndexed = true;
                showStatus('✅ Data berhasil diindeks!', 'success');
                setTimeout(hideStatus, 3000);
            } catch (error) {
                showStatus('❌ Error saat mengindeks data: ' + error.message, 'error');
            }
        }

        function loadIndexedData() {
            const savedData = localStorage.getItem('csvData');
            if (savedData) {
                csvData = JSON.parse(savedData);
                showStatus('✅ Data dimuat dari index tersimpan', 'success');
                setTimeout(hideStatus, 2000);
            }
        }

        function refreshIndex() {
            localStorage.removeItem('csvIndexed');
            localStorage.removeItem('csvData');
            isIndexed = false;
            csvData = [];
            indexData();
        }

        function searchData() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) {
                showStatus('❌ Mohon masukkan kata kunci pencarian', 'error');
                return;
            }
            if (csvData.length === 0) {
                showStatus('❌ Data belum diindeks. Silakan tunggu proses indexing selesai.', 'error');
                return;
            }
            currentResults = csvData.filter(row => {
                return Object.values(row).some(value =>
                    String(value).toLowerCase().includes(searchTerm.toLowerCase())
                );
            });
            if (currentResults.length === 0) {
                showStatus('❌ Data tidak ditemukan', 'error');
                clearPDF();
                return;
            }
            displayResults();
            showPDF(); // Tampilkan PDF sesuai IDPEL
        }

        function displayResults() {
            const resultsContainer = document.getElementById('resultsContainer');
            const searchForm = document.getElementById('searchForm');
            const searchAgainBtn = document.getElementById('searchAgainBtn');
            searchForm.classList.add('hidden');
            searchAgainBtn.classList.remove('hidden');
            resultsContainer.classList.remove('hidden');

            const tableHeader = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');
            tableHeader.innerHTML = '';
            tableBody.innerHTML = '';

            if (currentResults.length > 0) {
                const headerRow = document.createElement('tr');
                Object.keys(currentResults[0]).forEach(key => {
                    const th = document.createElement('th');
                    th.textContent = key.toUpperCase();
                    headerRow.appendChild(th);
                });
                tableHeader.appendChild(headerRow);

                currentResults.forEach(row => {
                    const tr = document.createElement('tr');
                    Object.values(row).forEach(value => {
                        const td = document.createElement('td');
                        td.textContent = value;
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                });

                showStatus(`✅ Ditemukan ${currentResults.length} hasil`, 'success');
                setTimeout(hideStatus, 3000);
            }
        }

        function searchAgain() {
            document.getElementById('searchForm').classList.remove('hidden');
            document.getElementById('searchAgainBtn').classList.add('hidden');
            document.getElementById('resultsContainer').classList.add('hidden');
            document.getElementById('searchInput').value = '';
            hideEditSection();
            hideStatus();
            clearPDF();
        }

        function showEditSection() {
            if (currentResults.length === 0) {
                showPopup('Error', 'Tidak ada data yang dipilih untuk diedit');
                return;
            }
            document.getElementById('editSection').style.display = 'block';
            document.getElementById('lokasiInput').value = currentLocation || 'Lokasi tidak tersedia';
        }

        function hideEditSection() {
            document.getElementById('editSection').style.display = 'none';
            document.getElementById('keteranganInput').value = '';
        }

        async function saveChanges() {
            const keterangan = document.getElementById('keteranganInput').value.trim();
            const lokasi = document.getElementById('lokasiInput').value.trim();

            if (!keterangan) {
                showPopup('Error', 'Mohon masukkan keterangan');
                return;
            }
            showStatus('<div class="spinner"></div>Menyimpan perubahan...', 'loading');
            try {
                await simulateSaveToCSV(keterangan, lokasi);
                showPopup('Berhasil!', 'Data berhasil diperbarui');
                hideEditSection();
                hideStatus();
            } catch (error) {
                showPopup('Error', 'Gagal menyimpan data: ' + error.message);
                hideStatus();
            }
        }

        async function simulateSaveToCSV(keterangan, lokasi) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    currentResults.forEach(row => {
                        row.keterangan = keterangan;
                        row.lokasi = lokasi;
                    });
                    csvData.forEach(row => {
                        const foundResult = currentResults.find(r => r.id === row.id);
                        if (foundResult) {
                            row.keterangan = keterangan;
                            row.lokasi = lokasi;
                        }
                    });
                    localStorage.setItem('csvData', JSON.stringify(csvData));
                    displayResults();
                    resolve();
                }, 1000);
            });
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        currentLocation = `${lat}, ${lon}`;
                    },
                    function(error) {
                        currentLocation = 'Lokasi tidak dapat diakses';
                    }
                );
            } else {
                currentLocation = 'Geolocation tidak didukung';
            }
        }

        function showPopup(title, message) {
            document.getElementById('popupTitle').textContent = title;
            document.getElementById('popupMessage').textContent = message;
            document.getElementById('popupOverlay').style.display = 'block';
            document.getElementById('popup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
            document.getElementById('popup').style.display = 'none';
        }

        document.getElementById('popupOverlay').addEventListener('click', closePopup);

        // ========== BAGIAN PDF ==========
        function showPDF() {
            clearPDF();
            if (currentResults.length === 0) return;
            // Cek kolom IDPEL pada hasil pertama
            const idpel = currentResults[0].idpel;
            if (!idpel) return;
            const pdfUrl = `data_pdf/${idpel}.pdf`;

            const pdfContainer = document.getElementById('pdfContainer');
            // Cek apakah PDF ada dengan fetch HEAD
            fetch(pdfUrl, {method: 'HEAD'})
                .then(res => {
                    if (res.ok) {
                        pdfContainer.innerHTML = `
                            <h3 style="margin-bottom:10px;">📄 Program PDF untuk IDPEL: ${idpel}</h3>
                            <iframe src="${pdfUrl}" width="100%" height="600px" style="border-radius:10px;border:1px solid #ccc;"></iframe>
                        `;
                    } else {
                        pdfContainer.innerHTML = `<div class="status error">❌ PDF untuk IDPEL: ${idpel} tidak ditemukan.</div>`;
                    }
                })
                .catch(() => {
                    pdfContainer.innerHTML = `<div class="status error">❌ PDF untuk IDPEL: ${idpel} tidak ditemukan.</div>`;
                });
        }

        function clearPDF() {
            document.getElementById('pdfContainer').innerHTML = '';
        }
    </script>
</body>
</html>
